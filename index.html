<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0b0f17">
  <meta name="description" content="Terra Conquest — conquérez la Terre, développez votre civilisation et partez à la conquête des planètes.">
  <title>Terra Conquest</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='28' fill='%232f6b8f'/%3E%3Cpath d='M14 26c8-10 18-6 22 0s14 4 16 12c-6 12-20 14-26 8s-14-8-12-20z' fill='%235f9a4a'/%3E%3C/svg%3E">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Terra Conquest">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-era="0">
  <canvas id="map"></canvas>

  <!-- Écran d'accueil -->
  <section id="menu" class="screen">
    <div class="menu-bg"></div>
    <div class="menu-card">
      <h1 class="logo">Terra <span>Conquest</span></h1>
      <p class="tagline">Conquérez votre monde, bâtissez une civilisation, puis partez à l'assaut des étoiles.</p>
      <div class="tabs" role="tablist">
        <button class="tab active" data-mode="earth" role="tab">🌍 Terre réelle</button>
        <button class="tab" data-mode="proc" role="tab">🪐 Monde procédural</button>
      </div>
      <div class="form">
        <div class="row proc-only">
          <label for="seed">Graine du monde</label>
          <div class="inline">
            <input id="seed" type="text" maxlength="24" autocomplete="off" spellcheck="false">
            <button id="seed-rand" class="btn icon" title="Graine aléatoire">🎲</button>
            <button id="seed-share" class="btn icon" title="Copier le lien de partage">🔗</button>
          </div>
        </div>
        <div class="row proc-only">
          <label for="ptype">Type de monde</label>
          <select id="ptype"></select>
        </div>
        <div class="row">
          <label for="nai">Pays IA : <b id="nai-val"></b></label>
          <input id="nai" type="range" min="6" max="175" step="1">
        </div>
        <div class="row three">
          <div>
            <label for="diff">Difficulté</label>
            <select id="diff">
              <option value="facile">Facile</option>
              <option value="normal" selected>Normal</option>
              <option value="difficile">Difficile</option>
              <option value="impossible">Impossible</option>
            </select>
          </div>
          <div>
            <label for="pace">Rythme</label>
            <select id="pace" title="Vitesse des guerres : offensives, combats, recrutement et décisions de l'IA">
              <option value="0.6" selected>Stratégique</option>
              <option value="0.8">Posé</option>
              <option value="1">Classique</option>
            </select>
          </div>
          <div>
            <label for="speed0">Vitesse</label>
            <select id="speed0">
              <option value="1" selected>x1</option>
              <option value="2">x2</option>
              <option value="4">x4</option>
            </select>
          </div>
        </div>
      </div>
      <div class="menu-actions">
        <button id="btn-new" class="btn primary big">Nouvelle partie</button>
        <button id="btn-continue" class="btn big" hidden>Continuer</button>
        <button id="btn-multi" class="btn big">👥 Multijoueur</button>
        <div class="inline small-actions">
          <button id="btn-import" class="btn ghost">📂 Importer une sauvegarde</button>
          <button id="btn-help" class="btn ghost">❓ Comment jouer</button>
        </div>
        <input id="import-file" type="file" accept=".json,application/json" hidden>
      </div>
      <p class="foot">Données cartographiques : Natural Earth / world-atlas (domaine public, ISC).</p>
    </div>
  </section>

  <!-- Chargement -->
  <section id="loading" class="screen" hidden>
    <div class="loader">
      <div class="globe"></div>
      <p id="loading-msg">Génération du monde…</p>
      <div class="bar"><div id="loading-bar"></div></div>
    </div>
  </section>

  <!-- Choix du pays -->
  <section id="pick" class="overlay" hidden>
    <div class="pick-banner">
      <b>Choisissez votre pays</b><span class="hide-m"> — touchez la carte.</span>
      <button id="pick-random" class="btn small">🎲 Au hasard</button>
      <button id="pick-back" class="btn small ghost">← Menu</button>
    </div>
    <div id="pick-card" class="card pick-card" hidden></div>
    <div id="lobby-card" class="card lobby-card" hidden></div>
  </section>

  <!-- Interface de jeu -->
  <section id="hud" hidden>
    <header id="topbar">
      <div id="tb-country" class="tb-country"></div>
      <div id="tb-stats" class="tb-stats"></div>
      <div class="tb-right">
        <div id="tb-time" class="tb-time"></div>
        <div class="speed" id="speed">
          <button data-speed="0" title="Pause (Espace)">⏸</button>
          <button data-speed="1" title="Vitesse x1">x1</button>
          <button data-speed="2" title="Vitesse x2">x2</button>
          <button data-speed="4" title="Vitesse x4">x4</button>
        </div>
        <button id="btn-tech" class="btn tb-btn" title="Technologies (T)">🔬<span class="badge" id="tech-badge" hidden></span></button>
        <button id="btn-empire" class="btn tb-btn" title="Empire : gouvernement, merveilles, ressources, armée (E)">🏛️</button>
        <button id="btn-goals" class="btn tb-btn" title="Objectifs">🚀</button>
        <button id="btn-emote" class="btn tb-btn" title="Message rapide" hidden>💬</button>
        <button id="btn-menu" class="btn tb-btn" title="Menu (Échap)">☰</button>
      </div>
    </header>
    <aside id="panel" class="panel"></aside>
    <div id="news" class="news"></div>
    <canvas id="minimap" width="240" height="94"></canvas>
    <button id="aim-pct" class="fab" title="Part de l'armée engagée par attaque">⚔️ 50 %</button>
    <div id="toasts" class="toasts"></div>
    <div id="advisor" class="advisor" hidden></div>
  </section>

  <!-- Vue spatiale -->
  <section id="space" class="screen" hidden>
    <canvas id="space-canvas"></canvas>
    <div class="space-ui">
      <div id="space-crumbs" class="space-crumbs"></div>
      <div id="space-card" class="card space-card"></div>
    </div>
  </section>

  <!-- Timelapse -->
  <section id="replay" hidden>
    <div class="rp-top card">
      <b>🎬 Histoire de <span id="rp-planet"></span></b>
      <span id="rp-time" class="hint"></span>
      <button id="rp-close" class="btn small">✕ Fermer</button>
    </div>
    <div id="rp-board" class="rp-board"></div>
    <div class="rp-ctl card">
      <button id="rp-play" class="btn small">⏸</button>
      <input id="rp-seek" type="range" min="0" max="1000" value="0">
      <button id="rp-speed" class="btn small">x40</button>
    </div>
  </section>

  <div id="tip" class="tip" hidden></div>

  <div id="modal" class="modal" hidden>
    <div class="modal-box">
      <button class="modal-close" id="modal-close" aria-label="Fermer">✕</button>
      <div id="modal-body"></div>
    </div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
